[project]
name = "sqe-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = " EUPL-1.2"
license-files = ["LICENSE"]
authors = [
    { name = "András Márton Gunyhó", email = "andras.gunyho@riken.jp" }
]
requires-python = ">=3.13"
dependencies = [
    "scipy>=1.18.0",
    "xarray>=2026.7.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # h5netcdf & h5py are needed to load the example data in the unit tests
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
]
docs = [
    "sphinx>=8",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "furo",
    "autodocsumm>=0.2.15",
    "myst-nb>=1.4.0",
    "hvplot>=0.12.2",
]
